name: Okena

options:
  bundleIdPrefix: io.taina
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  OkenaCore:
    path: ../Core

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Okena:
    type: application
    platform: iOS
    sources:
      - path: Sources/Okena
      # The three variable faces and their OFL licenses. Same axis (wght)
      # as the web, which self-hosts the variable woff2 of the same families.
      - path: Resources/Fonts
        buildPhase: resources
      # The app icon, authored in Icon Composer (Xcode 27). Xcode compiles it
      # into Assets.car and writes CFBundleIconName from the build setting
      # below; for the iOS 18 deployment target it also renders the legacy
      # PNG sizes from the same file, so there is no asset catalog.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: OkenaCore
    info:
      path: Sources/Okena/Info.plist
      properties:
        CFBundleDisplayName: "Tainá"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # The box builds the deep links of the invite and the password reset
        # (taina://convite/:token and taina://redefinir/:token, with the box
        # address in the `host` query param). The scheme is registered here
        # so the link opens the app, which resolves it natively, without a
        # browser (SessionModel.handleDeepLink).
        CFBundleURLTypes:
          - CFBundleURLName: io.taina.app
            CFBundleURLSchemes:
              - taina
        # One theme: the night one (DESIGN.md: dark-first, a single theme;
        # a light one is a future decision, not a shipped one). The semantic
        # tokens in Theme.swift carry the night values of tokens.css only.
        UIUserInterfaceStyle: Dark
        # The box address is typed by the person on the first screen, so the
        # app cannot know at build time whether it answers over TLS. The
        # exception is as scoped as iOS allows, which is not far: it cannot
        # be per-domain (NSExceptionDomains is static, and no one can
        # enumerate hosts typed at runtime), and NSAllowsLocalNetworking
        # covers only .local names and private-range IP literals, while the
        # pilot box lives behind a tailnet name such as taina.yby, a fully
        # qualified host ATS classifies as neither (InstanceAddress.swift
        # records the local-only rule that was tried and refused real
        # boxes). Cleartext is allowed and stated out loud instead
        # (InstanceAddress.isCleartext). App Store review wants this reason
        # in the review notes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - BricolageGrotesque-Variable.ttf
          - SchibstedGrotesk-Variable.ttf
          - JetBrainsMono-Variable.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.taina.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  Okena:
    build:
      targets:
        Okena: all
    run:
      config: Debug
